<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fictional Chat State Fixture</title>
</head>
<body>
  <h1>Fictional chat</h1>
  <p>Locally-authored, synthetic controls; no network connection or account state.</p>
  <section id="study-root" data-selection="none" data-phase="idle"
           data-message-count="0" data-conversation-count="0"
           data-parent-links="0" data-rejected-actions="0">
    <button id="select-chat">Select fictional conversation</button>
    <button id="draft">Edit fictional draft</button>
    <button id="submit">Submit fictional draft</button>
    <button id="receive">Show fictional response started</button>
    <button id="complete">Complete fictional response</button>
    <button id="stop">Stop fictional response</button>
    <button id="fail">Fail fictional response</button>
    <button id="retry">Retry fictional response</button>
    <button id="fork">Create fictional separate conversation</button>
  </section>
  <script>
    "use strict";
    const root = document.getElementById("study-root");
    function set(key, value) { root.dataset[key] = String(value); }
    function count(key, delta) { set(key, Number(root.dataset[key]) + delta); }
    function conditional(allowed, action) {
      if (allowed) action();
      else count("rejectedActions", 1);
    }
    const handlers = {
      "select-chat": () => conditional(root.dataset.selection === "none", () => {
        set("selection", "selected");
        count("conversationCount", 1);
      }),
      "draft": () => conditional(
        root.dataset.selection === "selected" &&
        ["idle", "complete", "stopped"].includes(root.dataset.phase),
        () => set("phase", "editing")),
      "submit": () => conditional(root.dataset.phase === "editing", () => {
        set("phase", "sending");
        count("messageCount", 1);
      }),
      "receive": () => conditional(root.dataset.phase === "sending", () => set("phase", "receiving")),
      "complete": () => conditional(root.dataset.phase === "receiving", () => {
        set("phase", "complete");
        count("messageCount", 1);
        count("parentLinks", 1);
      }),
      "stop": () => conditional(root.dataset.phase === "receiving", () => set("phase", "stopped")),
      "fail": () => conditional(["sending", "receiving"].includes(root.dataset.phase),
        () => set("phase", "failed")),
      "retry": () => conditional(root.dataset.phase === "failed",
        () => set("phase", "sending")),
      "fork": () => conditional(root.dataset.selection === "selected", () =>
        count("conversationCount", 1)),
    };
    Object.entries(handlers).forEach(([id, fn]) =>
      document.getElementById(id).addEventListener("click", fn));
  </script>
</body>
</html>

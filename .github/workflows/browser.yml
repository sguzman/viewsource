name: Atlas browser smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public atlas
        run: python3 scripts/build_site.py --out _site
      - name: Install Playwright and browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Test browser interaction against local artifact
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/viewsource-http.log 2>&1 &
          sleep 2
          node tests/browser_smoke.mjs
      - name: Exercise content-free synthetic chat probe
        run: |
          node tests/synthetic_chat_probe.mjs
          for kind in complete stopped failed-retry failed-early; do
            python3 scripts/validate_chat_observation.py /tmp/viewsource-synthetic-chat-$kind.json
            python3 scripts/analyze_chat_observation.py /tmp/viewsource-synthetic-chat-$kind.json > /tmp/viewsource-synthetic-chat-$kind-summary.json
          done
          python3 -c 'import json; get=lambda name: json.load(open("/tmp/viewsource-synthetic-chat-"+name+"-summary.json")); a,b,c,d=map(get,("complete","stopped","failed-retry","failed-early")); assert [x["step_count"] for x in (a,b,c,d)] == [6,5,8,4]; assert [x["structure_deltas"] for x in (a,b,c,d)] == [{"messages":2,"conversations":2,"parent_links":1},{"messages":1,"conversations":1,"parent_links":0},{"messages":2,"conversations":1,"parent_links":1},{"messages":1,"conversations":1,"parent_links":0}]; assert all(x["verified_transition_count"] == 0 for x in (a,b,c,d)); assert c["candidate_sequence_alignment"]["status_counts"] == {"consistent_with_candidate":8}; assert d["candidate_sequence_alignment"]["status_counts"] == {"consistent_with_candidate":4}'



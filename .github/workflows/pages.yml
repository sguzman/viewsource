name: Publish Specimen Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: viewsource-atlas-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify research records
        run: python3 scripts/validate.py
      - name: Verify atlas JavaScript syntax
        run: |
          node --check site/explorer.js
          node --check site/app.js
      - name: Build static atlas from reviewed public metadata
        run: python3 scripts/build_site.py --out _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

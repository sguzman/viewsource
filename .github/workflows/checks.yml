name: Repository checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check ontology and queue consistency
        run: python3 scripts/validate.py
      - name: Exercise offline capture workflow
        run: python3 -m unittest discover -s tests -v
      - name: Verify offline JavaScript AST research probe
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts acorn@8.15.0
          node scripts/static_ast_probe.cjs --self-test
          node scripts/trace_chat_impl.cjs --self-test
          python3 -m unittest discover -s tests -p test_static_impl_archive.py -v
      - name: Check atlas JavaScript syntax
        run: |
          node --check site/explorer.js
          node --check site/chat-graph.js
          node --check site/app.js
      - name: Build static specimen atlas
        run: python3 scripts/build_site.py --out _site
      - name: Check tracked publication boundaries
        run: python3 scripts/publication_guard.py
